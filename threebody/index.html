<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三體沙盤 Threebody — Earth–Moon CR3BP</title>
<meta name="description" content="An Earth–Moon three-body sandbox. Every path is numerically integrated from the CR3BP equations.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="view"></canvas>

<div class="top">
  <header class="panel head">
    <h1 id="title">Earth–Moon horseshoe</h1>
    <p id="blurb"></p>
    <p id="note" class="note"></p>
  </header>

  <details id="diag" class="panel readout" open>
    <summary>diagnostics</summary>
    <pre id="readout"></pre>
  </details>
</div>

<div class="panel controls">
  <label>Preset <select id="preset"></select></label>
  <label>Frame
    <select id="frame">
      <option value="rotating">rotating — horseshoe view</option>
      <option value="earth">Earth-following — intuitive view</option>
      <option value="inertial">barycentric inertial — space view</option>
    </select>
  </label>
  <label>Speed
    <input id="speed" type="range" min="0.05" max="20" step="0.05" value="8">
    <span id="speedLabel">8 d/s</span>
  </label>
  <div class="row">
    <button id="play" class="pill">Pause</button>
    <button id="reset" class="pill ghost">Reset</button>
    <button id="fit" class="pill ghost">Fit</button>
    <label class="check"><input id="zvc" type="checkbox"> zero-velocity</label>
    <label class="check"><input id="vel" type="checkbox" checked> velocity</label>
  </div>
  <div class="row">
    <label>Target <select id="target"></select></label>
    <button id="plan" class="pill ghost">Plan burn</button>
    <button id="execute" class="pill" disabled>Execute</button>
  </div>
  <p class="hint">Drag the spacecraft to burn — position does not change, velocity does. Drag anywhere else to pan; pinch or scroll to zoom; double-tap to fit.</p>
</div>

<script type="module" src="src/app.js?v=20260830e"></script>
</body>
</html>
